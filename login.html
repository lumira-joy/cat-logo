<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso Admin - Lumira</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #FFA8C0,
                    #FF764F
                );
        }

        .login-container {
            width: 90%;
            max-width: 400px;

            background: #fff;

            padding: 40px 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .titulo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 9px;

            font-size: 15px;
            outline: none;

            margin-bottom: 18px;
        }

        input:focus {
            border-color: #FFA8C0;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #FFA8C0,
                    #FF764F
                );

            color: #000;

            font-weight: bold;
            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .error {
            display: none;

            margin-top: 15px;
            padding: 10px;

            border-radius: 8px;

            background: #ffe5e5;
            color: #b00020;

            text-align: center;
            font-size: 14px;
        }

        .volver {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #555;

            text-decoration: none;

            font-size: 13px;
        }

        .volver:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">

            <img
                src="images/logo.png"
                alt="Lumira"
            >

        </div>


        <div class="titulo">
            Panel de administración
        </div>


        <div class="subtitulo">
            Ingresá para administrar Lumira
        </div>


        <form id="login-form">


            <label for="email">
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Tu email"
                autocomplete="email"
                required
            >


            <label for="password">
                Contraseña
            </label>


            <input
                type="password"
                id="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="boton-login"
            >
                Ingresar
            </button>


        </form>


        <div
            class="error"
            id="error"
        >
        </div>


        <a
            href="index.html"
            class="volver"
        >
            ← Volver al catálogo
        </a>


    </div>




    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* ========================================================
           SUPABASE
        ======================================================== */

        const SUPABASE_URL =
            "https://fnpxfmdgilsuipwyrkzs.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_K-2L2v84e3yEme6vSFzbAw_E8MiIpHr";


        const {
            createClient
        } = supabase;


        const supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );




        /* ========================================================
           ELEMENTOS
        ======================================================== */

        const loginForm =
            document.getElementById(
                "login-form"
            );


        const errorDiv =
            document.getElementById(
                "error"
            );


        const botonLogin =
            document.getElementById(
                "boton-login"
            );




        /* ========================================================
           LOGIN
        ======================================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                errorDiv.style.display =
                    "none";


                botonLogin.disabled =
                    true;


                botonLogin.textContent =
                    "Ingresando...";


                try {


                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                    if (error) {
                        throw error;
                    }


                    if (
                        !data ||
                        !data.session
                    ) {

                        throw new Error(
                            "Supabase no creó una sesión válida."
                        );

                    }


                    /* =================================================
                       GUARDAR SESIÓN
                    ================================================= */

                    localStorage.setItem(
                        "lumiraAccessToken",
                        data.session.access_token
                    );


                    localStorage.setItem(
                        "lumiraRefreshToken",
                        data.session.refresh_token
                    );


                    localStorage.setItem(
                        "lumiraAdminEmail",
                        email
                    );


                    console.log(
                        "Login correcto."
                    );


                    console.log(
                        "Access token guardado."
                    );


                    /* =================================================
                       IR AL ADMIN
                    ================================================= */

                    window.location.href =
                        "admin.html";


                }


                catch (error) {


                    console.error(
                        "Error de login:",
                        error
                    );


                    errorDiv.textContent =
                        error.message ||
                        "No se pudo iniciar sesión.";


                    errorDiv.style.display =
                        "block";


                    botonLogin.disabled =
                        false;


                    botonLogin.textContent =
                        "Ingresar";

                }

            }
        );


    </script>


</body>

</html>
