    <script>


        /* ========================================================
           SUPABASE
        ======================================================== */

        const SUPABASE_URL =
            "https://fnpxfmdgilsuipwyrkzs.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_K-2L2v84e3yEme6vSFzbAw_E8MiIpHr";




        /* ========================================================
           VARIABLES
        ======================================================== */

        let todosLosProductos = [];

        let carrito = [];




        /* ========================================================
           MENÚ PRINCIPAL
        ======================================================== */

        function toggleProductos() {

            const submenu =
                document.getElementById(
                    "submenu-productos"
                );

            submenu.classList.toggle(
                "activo"
            );

        }




        /* ========================================================
           ABRIR / CERRAR MATERIAL EN PC
        ======================================================== */

        function toggleMaterial(
            material
        ) {

            const tipos =
                document.getElementById(
                    "tipos-" + material
                );


            if (!tipos) {
                return;
            }


            tipos.classList.toggle(
                "activo"
            );

        }




        /* ========================================================
           FILTRAR POR MATERIAL + TIPO
        ======================================================== */

        function filtrarTipo(
            material,
            tipo
        ) {

            const productosFiltrados =
                todosLosProductos.filter(
                    producto => {

                        return (
                            producto.categoria === material &&
                            producto.tipo === tipo
                        );

                    }
                );


            mostrarProductos(
                productosFiltrados
            );


            document
                .getElementById(
                    "submenu-productos"
                )
                .classList.remove(
                    "activo"
                );

        }




        /* ========================================================
           MENÚ CELULAR
        ======================================================== */

        function abrirMenu() {

            document
                .getElementById(
                    "menu-lateral"
                )
                .classList.add(
                    "activo"
                );


            document
                .getElementById(
                    "menu-overlay"
                )
                .classList.add(
                    "activo"
                );

        }




        function cerrarMenu() {

            document
                .getElementById(
                    "menu-lateral"
                )
                .classList.remove(
                    "activo"
                );


            document
                .getElementById(
                    "menu-overlay"
                )
                .classList.remove(
                    "activo"
                );

        }




        /* ========================================================
           PRODUCTOS EN CELULAR
        ======================================================== */

        function toggleProductosCelu() {

            const submenu =
                document.getElementById(
                    "submenu-productos-celu"
                );


            submenu.classList.toggle(
                "activo"
            );

        }




        /* ========================================================
           MATERIAL EN CELULAR
        ======================================================== */

        function toggleMaterialCelu(
            material
        ) {

            const tipos =
                document.getElementById(
                    "tipos-celu-" + material
                );


            if (!tipos) {
                return;
            }


            tipos.classList.toggle(
                "activo"
            );

        }




        /* ========================================================
           FILTRAR EN CELULAR
        ======================================================== */

        function filtrarTipoCelu(
            material,
            tipo
        ) {

            const productosFiltrados =
                todosLosProductos.filter(
                    producto => {

                        return (
                            producto.categoria === material &&
                            producto.tipo === tipo
                        );

                    }
                );


            mostrarProductos(
                productosFiltrados
            );


            cerrarMenu();

        }




        /* ========================================================
           MATERIALES Y CUIDADOS
        ======================================================== */

        function mostrarCuidados() {

            alert(
                "Próximamente vas a encontrar acá toda la información sobre nuestros materiales y los cuidados de tus joyas. 💕"
            );

        }




        /* ========================================================
           MOSTRAR PRODUCTOS
        ======================================================== */

        function mostrarProductos(
            productos
        ) {

            const catalogo =
                document.getElementById(
                    "catalogo"
                );


            catalogo.innerHTML = "";



            /* ----------------------------------------------------
               SIN PRODUCTOS
            ---------------------------------------------------- */

            if (
                productos.length === 0
            ) {

                catalogo.innerHTML = `

                    <p class="sin-productos">
                        No hay productos para mostrar.
                    </p>

                `;

                return;

            }




            /* ----------------------------------------------------
               CREAR PRODUCTOS
            ---------------------------------------------------- */

            productos.forEach(
                producto => {


                    const tarjeta =
                        document.createElement(
                            "div"
                        );


                    tarjeta.classList.add(
                        "producto",
                        producto.categoria,
                        producto.tipo
                    );


                    tarjeta.dataset.productoId =
                        producto.id;




                    /* =================================================
                       IMAGEN
                    ================================================= */

                    const imagen =
                        document.createElement(
                            "img"
                        );


                    imagen.src =
                        producto.imagen ||
                        "images/sin-imagen.jpg";


                    imagen.alt =
                        producto.nombre;




                    /* =================================================
                       NOMBRE
                    ================================================= */

                    const nombre =
                        document.createElement(
                            "h2"
                        );


                    nombre.textContent =
                        producto.nombre;




                    /* =================================================
                       PRECIOS
                    ================================================= */

                    const precio =
                        document.createElement(
                            "div"
                        );


                    precio.classList.add(
                        "precio-producto"
                    );


                    const precioOriginal =
                        Number(
                            producto.precio
                        );


                    const descuento =
                        Number(
                            producto.descuento || 0
                        );


                    const precioFinal =
                        precioOriginal *
                        (
                            1 -
                            descuento / 100
                        );




                    if (
                        descuento > 0
                    ) {

                        precio.innerHTML = `

                            <div class="precio-fila">

                                <span
                                    class="precio-original"
                                >
                                    $${precioOriginal.toLocaleString("es-AR")}
                                </span>

                                <span
                                    class="descuento"
                                >
                                    ${descuento}% OFF
                                </span>

                            </div>


                            <div
                                class="precio-final"
                            >
                                $${precioFinal.toLocaleString("es-AR")}
                            </div>

                        `;

                    }

                    else {

                        precio.innerHTML = `

                            <span
                                class="precio-final"
                            >
                                $${precioOriginal.toLocaleString("es-AR")}
                            </span>

                        `;

                    }




                    /* =================================================
                       BOTÓN VER MÁS
                    ================================================= */

                    const boton =
                        document.createElement(
                            "a"
                        );


                    boton.textContent =
                        "Ver más";


                    boton.classList.add(
                        "boton"
                    );


                    boton.href =
                        "producto.html?id=" +
                        producto.id;




                    /* =================================================
                       BOTÓN AGREGAR
                    ================================================= */

                    const botonAgregar =
                        document.createElement(
                            "button"
                        );


                    botonAgregar.textContent =
                        "Agregar a mi selección";


                    botonAgregar.classList.add(
                        "boton-seleccion"
                    );




                    /* =================================================
                       STOCK
                    ================================================= */

                    const cantidadDisponible =
                        Number(
                            producto.cantidad_disponible || 0
                        );




                    /* =================================================
                       ACTUALIZAR BOTÓN
                    ================================================= */

                    function actualizarBotonAgregar() {

                        const existente =
                            carrito.find(
                                item =>
                                    item.id ===
                                    producto.id
                            );


                        if (
                            cantidadDisponible === 1 &&
                            existente
                        ) {

                            botonAgregar.textContent =
                                "✓ Añadido";


                            botonAgregar.classList.add(
                                "producto-anadido"
                            );

                        }

                        else {

                            botonAgregar.textContent =
                                "Agregar a mi selección";


                            botonAgregar.classList.remove(
                                "producto-anadido"
                            );

                        }

                    }




                    /* =================================================
                       CLICK AGREGAR
                    ================================================= */

                    botonAgregar.addEventListener(
                        "click",
                        () => {

                            const existente =
                                carrito.find(
                                    item =>
                                        item.id ===
                                        producto.id
                                );


                            if (
                                existente
                            ) {

                                const confirmar =
                                    confirm(

                                        "Este producto ya está en tu selección.\n\n" +
                                        "¿Querés agregar otra unidad?"

                                    );


                                if (
                                    !confirmar
                                ) {

                                    return;

                                }

                            }


                            agregarAlCarrito(
                                producto
                            );


                            actualizarBotonAgregar();

                        }
                    );




                    /* =================================================
                       ESTADO INICIAL
                    ================================================= */

                    actualizarBotonAgregar();




                    /* =================================================
                       ARMAR TARJETA
                    ================================================= */

                    tarjeta.appendChild(
                        imagen
                    );


                    tarjeta.appendChild(
                        nombre
                    );


                    tarjeta.appendChild(
                        precio
                    );


                    tarjeta.appendChild(
                        boton
                    );


                    tarjeta.appendChild(
                        botonAgregar
                    );


                    catalogo.appendChild(
                        tarjeta
                    );

                }
            );

        }




        /* ========================================================
           MOSTRAR SECCIÓN
        ======================================================== */

        function mostrarSeccion(
            seccion
        ) {

            if (
                seccion === "todos"
            ) {

                mostrarProductos(
                    todosLosProductos
                );

                return;

            }


            const productosFiltrados =
                todosLosProductos.filter(
                    producto =>
                        producto.categoria ===
                        seccion
                );


            mostrarProductos(
                productosFiltrados
            );

        }




        /* ========================================================
           CARGAR PRODUCTOS DESDE SUPABASE
        ======================================================== */

        async function cargarProductos() {

            try {

                const respuesta =
                    await fetch(

                        `${SUPABASE_URL}/rest/v1/productos?select=*`,

                        {

                            headers: {

                                "apikey":
                                    SUPABASE_KEY

                            }

                        }

                    );


                if (
                    !respuesta.ok
                ) {

                    throw new Error(

                        "Error al conectar con Supabase: " +
                        respuesta.status

                    );

                }


                const productos =
                    await respuesta.json();


                console.log(
                    "Productos recibidos:",
                    productos
                );



                /* ------------------------------------------------
                   SOLO PRODUCTOS CON STOCK
                ------------------------------------------------ */

                todosLosProductos =
                    productos.filter(
                        producto =>
                            Number(
                                producto.cantidad_disponible
                            ) > 0
                    );


                mostrarProductos(
                    todosLosProductos
                );

            }

            catch (
                error
            ) {

                console.error(
                    "Error cargando productos:",
                    error
                );

            }

        }




        /* ========================================================
           AGREGAR AL CARRITO
        ======================================================== */

        function agregarAlCarrito(
            producto
        ) {

            const existente =
                carrito.find(
                    item =>
                        item.id ===
                        producto.id
                );


            const cantidadDisponible =
                Number(
                    producto.cantidad_disponible || 0
                );


            if (
                existente
            ) {

                if (
                    existente.cantidad >=
                    cantidadDisponible
                ) {

                    alert(
                        "Ya seleccionaste todas las unidades disponibles de este producto. 💕"
                    );

                    return;

                }


                existente.cantidad++;

            }

            else {

                if (
                    cantidadDisponible <= 0
                ) {

                    alert(
                        "Este producto ya no está disponible."
                    );

                    return;

                }


                carrito.push({

                    ...producto,

                    cantidad: 1

                });

            }


            actualizarCarrito();

        }




        /* ========================================================
           ACTUALIZAR CARRITO
        ======================================================== */

        function actualizarCarrito() {

            const contador =
                document.getElementById(
                    "contador-carrito"
                );


            const cantidad =
                carrito.reduce(
                    (
                        total,
                        producto
                    ) =>
                        total +
                        producto.cantidad,
                    0
                );


            contador.textContent =
                cantidad;


            localStorage.setItem(
                "lumiraCarrito",
                JSON.stringify(
                    carrito
                )
            );

        }




        /* ========================================================
           ABRIR CARRITO
        ======================================================== */

        function abrirCarrito() {

            window.location.href =
                "carrito.html";

        }




        /* ========================================================
           CERRAR CARRITO
        ======================================================== */

        function cerrarCarrito() {

            window.location.href =
                "index.html";

        }




        /* ========================================================
           CARGAR CARRITO GUARDADO
        ======================================================== */

        function cargarCarritoGuardado() {

            const guardado =
                localStorage.getItem(
                    "lumiraCarrito"
                );


            if (
                !guardado
            ) {

                carrito = [];

                return;

            }


            try {

                carrito =
                    JSON.parse(
                        guardado
                    );

            }

            catch (
                error
            ) {

                carrito = [];

            }

        }




        /* ========================================================
           INICIAR
        ======================================================== */

        cargarCarritoGuardado();

        cargarProductos();

        actualizarCarrito();


    </script>


</body>
